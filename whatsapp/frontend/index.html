<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="avatar" id="userAvatar">U</div>
          <div class="user-meta">
            <p class="label">Connected as</p>
            <h1 id="displayName">Unknown user</h1>
          </div>
        </header>

        <section class="rooms-tools">
          <h2>Your Rooms <button id="newRoomBtn" class="new-room-btn" title="Create a new room">+</button></h2>
          <p class="hint">Joined rooms appear below. Discover and join other rooms from the list.</p>
        </section>

        <ul id="roomsList" class="room-list"></ul>

        <section class="discover">
          <h3>Available Rooms</h3>
          <ul id="discoverRoomsList" class="discover-list"></ul>
        </section>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="label">Current Room</p>
            <h2 id="activeRoomTitle">Select a room</h2>
          </div>
          <button id="toggleSubscriptionBtn" class="sub-toggle" disabled>
            Unsubscribe
          </button>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <footer class="composer">
          <form id="messageForm">
            <input
              id="messageInput"
              type="text"
              maxlength="500"
              placeholder="Type a message"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" disabled>Send</button>
          </form>
          <p id="status" class="status">Pick a subscribed room to chat.</p>
        </footer>
      </main>
    </div>
    <dialog id="joinDialog" class="join-dialog">
      <form id="joinForm" class="join-card">
        <h2>Join WhatsApp</h2>

        <label for="newUsernameInput">New username</label>
        <input id="newUsernameInput" type="text" placeholder="Enter a new username" autocomplete="off" />

        <div class="dialog-divider"><span>or pick an existing one</span></div>

        <label for="usernameSelect">Existing user</label>
        <select id="usernameSelect"></select>

        <button type="submit">Enter Chat</button>
      </form>
    </dialog>

    <dialog id="createRoomDialog" class="join-dialog">
      <form id="createRoomForm" class="join-card">
        <h2>Create a Room</h2>

        <label for="roomNameInput">Room name</label>
        <input id="roomNameInput" type="text" placeholder="Enter room name" autocomplete="off" required />

        <div class="dialog-actions">
          <button type="submit">Create</button>
          <button type="button" id="cancelCreateRoomBtn">Cancel</button>
        </div>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
